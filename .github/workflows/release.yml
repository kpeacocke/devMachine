name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (major, minor, patch)'
        required: false
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  check-syntax-validation:
    name: Wait for Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Wait for syntax validation to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'PowerShell Syntax Validation'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Check syntax validation status
        uses: actions/github-script@v7
        with:
          script: |
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              check_name: 'PowerShell Syntax Validation'
            });

            const syntaxCheck = checks.data.check_runs[0];
            if (!syntaxCheck || syntaxCheck.conclusion !== 'success') {
              core.setFailed('Syntax validation must pass before releasing');
            }

  check-integration-tests:
    name: Check Integration Tests Status
    runs-on: ubuntu-latest
    steps:
      - name: Check last integration test run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'integration-tests.yml',
              per_page: 1,
              status: 'completed'
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No completed integration test runs found. Run integration tests manually first.');
              return;
            }

            const lastRun = runs.data.workflow_runs[0];
            console.log(`Last integration test run: ${lastRun.html_url}`);
            console.log(`Status: ${lastRun.conclusion}`);
            console.log(`Completed: ${lastRun.updated_at}`);

            if (lastRun.conclusion !== 'success') {
              core.setFailed(`Last integration test run failed. Please fix and re-run integration tests before releasing.\nRun URL: ${lastRun.html_url}`);
            } else {
              console.log('✅ Integration tests passed');
            }

  validate:
    name: Run Validation Checks
    needs: [check-syntax-validation, check-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate bash scripts
        run: |
          find ./scripts/wsl -name "*.sh" -type f -exec bash -n {} \;
          find ./scripts/wsl -name "*.sh" -type f -exec shellcheck {} \;

      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $failed = $false
          $errors = @()

          foreach ($script in $scripts) {
            Write-Host "Validating $($script.Name)..."
            try {
              $parseErrors = $null
              $null = [System.Management.Automation.PSParser]::Tokenize(
                (Get-Content $script.FullName -Raw),
                [ref]$parseErrors
              )

              if ($parseErrors.Count -gt 0) {
                $failed = $true
                $errors += "$($script.Name) has parse errors:"
                foreach ($err in $parseErrors) {
                  $errors += "  Line $($err.Token.StartLine): $($err.Message)"
                }
              }
            } catch {
              $failed = $true
              $errors += "$($script.Name) failed: $_"
            }
          }

          if ($failed) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "PowerShell script validation failed"
          }

          Write-Host "✓ All scripts validated successfully"

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  release:
    name: Create Release
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            conventional-changelog-conventionalcommits@7

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Fix CHANGELOG formatting
        run: |
          # Check if CHANGELOG was updated
          if git diff HEAD~1 HEAD --name-only | grep -q "CHANGELOG.md"; then
            echo "Fixing CHANGELOG.md formatting..."

            # Remove multiple consecutive blank lines (keep only 1)
            sed -i.bak '/^$/N;/^\n$/D' CHANGELOG.md

            # Check if changes were made
            if ! git diff --quiet CHANGELOG.md; then
              git add CHANGELOG.md
              git commit -m "chore(changelog): fix markdown formatting [skip ci]"
              git push origin HEAD:main
              echo "✓ CHANGELOG.md formatting fixed"
            else
              echo "✓ CHANGELOG.md formatting is already correct"
            fi
          else
            echo "CHANGELOG.md was not updated in this release"
          fi

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No release created"
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout latest tag
        if: steps.get_tag.outputs.created == 'true'
        run: |
          git fetch --tags
          git checkout ${{ steps.get_tag.outputs.tag }}

      - name: Create release archives
        if: steps.get_tag.outputs.created == 'true'
        run: |
          mkdir -p release-artifacts
          TAG=${{ steps.get_tag.outputs.tag }}

          # Create Windows scripts archive
          zip -r release-artifacts/devMachine-windows-scripts-${TAG}.zip \
            scripts/windows/*.ps1 \
            setup-machine.ps1 \
            README.md \
            LICENSE

          # Create WSL scripts archive
          zip -r release-artifacts/devMachine-wsl-scripts-${TAG}.zip \
            scripts/wsl/*.sh \
            README.md \
            LICENSE

          # Create complete archive
          zip -r release-artifacts/devMachine-complete-${TAG}.zip \
            scripts/ \
            tests/ \
            setup-machine.ps1 \
            README.md \
            LICENSE \
            SECURITY.md \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            CHANGELOG.md

      - name: Generate checksums
        if: steps.get_tag.outputs.created == 'true'
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums-${{ steps.get_tag.outputs.tag }}.txt

      - name: Upload release assets
        if: steps.get_tag.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.get_tag.outputs.tag }}
          gh release upload $TAG release-artifacts/*.zip release-artifacts/checksums-*.txt

      - name: Upload artifacts
        if: steps.get_tag.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.get_tag.outputs.tag }}
          path: release-artifacts/
          retention-days: 90
